<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thượng Phương Các</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Bố cục: thanh điều hướng xanh đậm phía trên; trang Khoá học = sidebar bài học bên trái + tab tác vụ ngang phía trên nội dung */
:root{
  --navy:#132a5c; --navy-2:#1d3f82; --navy-soft:#e8eef9;
  --accent:#c23320; --accent-soft:#fbe9e6;
  --bg:#ffffff; --surface:#f5f7fb; --card:#ffffff; --line:#dbe2ee;
  --ink:#16213a; --muted:#5a6680; --on-navy:#ffffff;
  --ok:#17855a; --ok-bg:#e5f5ed; --bad:#b42318; --bad-bg:#fdebe8;
  --grid:#e9b7ae;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-zh-d:"Noto Serif SC","Songti SC","SimSun",serif;
  --r:10px; --fz:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0c1a3a; --navy-2:#5b84d6; --navy-soft:#1a2747;
  --accent:#e2563f; --accent-soft:#3a1a15;
  --bg:#0d1424; --surface:#131c31; --card:#162039; --line:#26324e;
  --ink:#e6ebf5; --muted:#9ba7c0; --on-navy:#ffffff;
  --ok:#48c48a; --ok-bg:#103223; --bad:#f2846f; --bad-bg:#3a1a15; --grid:#6a3a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0c1a3a; --navy-2:#5b84d6; --navy-soft:#1a2747;
  --accent:#e2563f; --accent-soft:#3a1a15;
  --bg:#0d1424; --surface:#131c31; --card:#162039; --line:#26324e;
  --ink:#e6ebf5; --muted:#9ba7c0; --on-navy:#ffffff;
  --ok:#48c48a; --ok-bg:#103223; --bad:#f2846f; --bad-bg:#3a1a15; --grid:#6a3a33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.zh{font-family:var(--f-zh)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shell: sidebar trái điều hướng + nội dung bên phải */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;gap:14px;padding:18px 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 8px;color:var(--on-navy);text-align:left}
.seal{width:38px;height:38px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-family:var(--f-zh-d);font-weight:700;font-size:21px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex:none}
.brand b{font-size:17px;letter-spacing:.02em;font-weight:700;white-space:nowrap;display:block}
.brand small{display:block;font-size:11px;opacity:.7;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.snav{display:flex;flex-direction:column;gap:2px}
.snav>button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;border:0;background:none;color:rgba(255,255,255,.78);font-weight:500;font-size:14.5px;text-align:left}
.snav>button svg{width:18px;height:18px;flex:none;opacity:.85}
.snav>button:hover{background:rgba(255,255,255,.07);color:#fff}
.snav>button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.sb-course{margin:4px 0 6px 10px;padding-left:12px;border-left:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:8px}
.sb-course select{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18);font-size:13.5px;padding:7px 9px}
.sb-course select option{color:#16213a;background:#fff}
.sb-course .cs{font-size:11.5px;color:rgba(255,255,255,.6);padding:0 2px}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 9px;align-items:center;color:#fff}
.lessons button:hover{background:rgba(255,255,255,.07)}
.lessons button.on{background:rgba(255,255,255,.14)}
.lessons .no{grid-row:span 2;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;background:rgba(255,255,255,.1);font-size:12.5px}
.lessons button.on .no{background:var(--accent)}
.lessons .t{font-family:var(--f-zh);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lessons .s{font-size:11px;color:rgba(255,255,255,.55)}
.lessons .s em{font-style:normal;color:#7fe0b0;font-weight:600}
.sb-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
.sync{opacity:.85;display:flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:#f5b041;display:inline-block}
.sync.on i{background:#4cd18f}
.mtop{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff;align-items:center;gap:10px;min-height:54px}
.mtop .brand{padding:0}
.menu-btn{width:40px;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;display:grid;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(5,12,30,.45);z-index:39}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;top:0;bottom:0;left:0;height:auto;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .sb.open{transform:none}
  .mtop{display:flex}
}
main{max-width:1280px;margin:0 auto;width:100%}
.view{padding-block:26px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);padding:0;flex:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
.badge.navy{background:var(--navy-soft);color:var(--navy-2)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--navy-2);box-shadow:0 1px 3px rgba(10,20,50,.12);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
table{border-collapse:collapse;width:100%}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;background:var(--surface);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}

/* ===== Home ===== */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,50px);font-weight:700;color:var(--navy-2);letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{font-size:17px;color:var(--muted);max-width:56ch;margin:14px 0 22px}
.hero-img{margin:0;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px;width:100%}
.hero-img img{display:block;width:auto;max-width:100%;height:clamp(300px,42vw,460px);object-fit:contain;filter:drop-shadow(0 14px 18px rgba(19,42,92,.18))}
.hero-img figcaption{font-weight:600;color:var(--navy-2);font-size:15px;letter-spacing:.02em;padding:6px 14px;border-radius:999px;background:var(--navy-soft)}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px}
.hero-stats div b{display:block;font-size:24px;color:var(--navy-2)}
.hero-stats div span{font-size:13px;color:var(--muted)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-img{justify-self:center;max-width:340px}}
.sec-h{display:flex;align-items:end;gap:12px;margin:44px 0 16px;flex-wrap:wrap}
.sec-h h2{font-size:22px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ccard{text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--navy-2);transform:translateY(-2px)}
.ccard h3{font-size:19px;color:var(--navy-2)}
.ccard .bar{height:6px;border-radius:9px;background:var(--surface);overflow:hidden;margin-top:6px}
.ccard .bar i{display:block;height:100%;background:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.quick button{text-align:left;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.quick button:hover{border-color:var(--navy-2)}
.quick svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:2px}
.quick b{display:block}
.quick span{font-size:13px;color:var(--muted)}

/* ===== Course content ===== */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--navy-2);border-bottom-color:var(--accent);font-weight:600}
@media (max-width:900px){.tabs{top:calc(54px + env(safe-area-inset-top,0px))}}
.toolrow{display:flex;align-items:center;gap:6px;padding:10px 0 0}
.crumb{font-size:12.5px;color:var(--muted);margin-right:auto;font-weight:500}
.crumb b{color:var(--accent)}
.panel{padding:18px 0 10px;font-size:calc(15px * var(--fz))}
.panel h2.ph{font-size:calc(21px * var(--fz));color:var(--navy-2);margin-bottom:14px}

/* lesson home */
.lhome{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.lhome-top{background:var(--navy);color:#fff;padding:34px 30px 30px;position:relative}
.lhome-top .eyebrow{color:#ffb9ad}
.lhome-top .brandline{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-weight:600;letter-spacing:.04em}
.lhome-top .brandline .seal{width:30px;height:30px;font-size:17px}
.ltitle{font-family:var(--f-zh-d);font-weight:700;font-size:clamp(38px,6vw,68px);letter-spacing:.04em;line-height:1.15;margin:8px 0 6px}
.lpy{font-size:clamp(17px,2vw,22px);opacity:.9;font-style:italic}
.lvi{font-size:clamp(18px,2.2vw,24px);font-weight:600;margin-top:4px}
.lno{position:absolute;right:26px;top:22px;font-family:var(--f-zh-d);font-size:110px;line-height:1;opacity:.12;font-weight:700}
.lhome-body{padding:24px 30px 28px;background:var(--card)}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:12px}
.obj{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.obj b{color:var(--accent);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.obj p{margin:6px 0 0}

/* vocab table */
.vt td.hz{font-family:var(--f-zh-d);font-size:calc(26px * var(--fz));font-weight:700;color:var(--navy-2);white-space:nowrap}
.vt td.py{color:var(--accent);font-weight:500;white-space:nowrap}
.vt td.pos{color:var(--muted);font-size:13px;white-space:nowrap}
.vt td.col{font-family:var(--f-zh);font-size:calc(14px * var(--fz));color:var(--ink)}
.vt.hide-py td.py span,.vt.hide-vi td.vi span{visibility:hidden}
.vt tr:hover td{background:var(--surface)}

/* flashcards */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc{width:min(520px,100%);aspect-ratio:8/5;perspective:1200px;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;box-shadow:0 14px 30px -18px rgba(19,42,92,.5)}
.fc-face.back{transform:rotateY(180deg);background:var(--navy);color:#fff;border-color:var(--navy)}
.fc-face .big{font-family:var(--f-zh-d);font-size:clamp(56px,11vw,104px);font-weight:700;color:var(--navy-2);line-height:1.1}
.fc-face .fpy{font-size:clamp(24px,4vw,36px);font-weight:600;color:#ffcfc6}
.fc-face .fvi{font-size:clamp(18px,2.6vw,24px);text-align:center}
.fc-face .fpos{font-size:13px;opacity:.75}
.fc-face .corner{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted)}
.fc-face.back .corner{color:rgba(255,255,255,.6)}
.fc-face .learned{position:absolute;top:12px;right:16px}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fc-grid .fc{aspect-ratio:1/1;width:100%}
.fc-grid .fc-face{border-radius:12px;padding:10px}
.fc-grid .big{font-size:44px}
.fc-grid .fpy{font-size:19px}
.fc-grid .fvi{font-size:14px}
.prog{font-variant-numeric:tabular-nums;color:var(--muted)}

/* exercises */
.qlist{display:flex;flex-direction:column;gap:12px}
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card)}
.q .qt{font-size:calc(17px * var(--fz));margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.q .qn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy-2);display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.q .zhq{font-family:var(--f-zh);font-size:calc(18px * var(--fz))}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;font-size:calc(15px * var(--fz))}
.opt.zh{font-size:calc(17px * var(--fz))}
.opt:hover:not(:disabled){border-color:var(--navy-2)}
.opt:disabled{cursor:default}
.opt.ok,.ok-box{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.bad,.bad-box{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.score{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:var(--navy-soft);margin-top:14px;flex-wrap:wrap}
.score b{font-size:22px;color:var(--navy-2)}
.fb{font-size:14px;margin-top:8px;padding:8px 12px;border-radius:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px;text-align:left;min-height:52px}
.match button.zh{font-family:var(--f-zh-d);font-size:24px;text-align:center;font-weight:700;color:var(--navy-2)}
.match button.sel{border-color:var(--navy-2);box-shadow:0 0 0 2px var(--navy-2) inset}
.match button.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);opacity:.75}
.match button.miss{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bank{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px dashed var(--line);margin-bottom:10px}
.bank span{font-family:var(--f-zh);font-size:18px;padding:2px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
.blank-sel{display:inline-block;width:auto;min-width:96px;padding:4px 8px;font-family:var(--f-zh);font-size:17px;margin:0 4px}
.pos-s{font-family:var(--f-zh);font-size:calc(20px * var(--fz));line-height:2.2}
.pos-s .slot{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;margin:0 4px;font-family:var(--f-ui);font-weight:700;font-size:14px;color:var(--navy-2)}
.pos-s .slot:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pos-s .slot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pos-s .slot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.wordtag{display:inline-block;font-family:var(--f-zh);background:var(--accent);color:#fff;border-radius:6px;padding:1px 10px;font-size:18px;margin-right:6px}

/* grammar */
.gcard{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin-bottom:18px}
.gcard-h{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.gcard-h .gn{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.gcard-h h3{font-family:var(--f-zh-d);font-size:calc(28px * var(--fz));color:var(--navy-2)}
.gcard-h .gpy{color:var(--accent);font-style:italic}
.gpart{padding:16px 18px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px}
.gpart:last-of-type{border-bottom:0}
.formula{font-family:var(--f-zh);font-size:calc(16px * var(--fz));background:var(--navy-soft);color:var(--navy-2);border-radius:8px;padding:10px 12px;font-weight:500;align-self:start}
.gex{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.gex li{display:flex;gap:10px;align-items:flex-start}
.gex .zh{font-size:calc(17px * var(--fz))}
.gex .vi{color:var(--muted);font-size:calc(14px * var(--fz))}
.gnote{margin:0;padding:12px 18px;background:var(--accent-soft);color:var(--ink);font-size:14px;border-top:1px solid var(--line)}
.gnote b{color:var(--accent)}
@media (max-width:700px){.gpart{grid-template-columns:1fr}}

/* reading */
.textbox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 20px;margin-bottom:16px}
.textbox h3{font-family:var(--f-zh-d);font-size:calc(22px * var(--fz));color:var(--navy-2)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;margin-top:14px}
.dl .who{font-family:var(--f-zh);font-weight:700;color:var(--accent);white-space:nowrap}
.dl .say,.para{font-family:var(--f-zh);font-size:calc(19px * var(--fz));line-height:1.9}
.para{text-indent:2em;margin-top:12px}
.pyl{display:block;font-family:var(--f-ui);font-size:calc(13.5px * var(--fz));color:var(--muted);line-height:1.5;text-indent:0}
.hide-py .pyl{display:none}

/* listening */
.lcard .play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:grid;place-items:center;flex:none}
.lcard .play svg{width:20px;height:20px}
.lcard .play.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(194,51,32,.15)}}
.trans{margin-top:10px;padding:10px 12px;background:var(--surface);border-radius:8px;font-family:var(--f-zh);font-size:16px}

/* writing */
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;padding:8px;border-radius:8px}
.tiles.ans{border:2px dashed var(--line);background:var(--surface)}
.tile{font-family:var(--f-zh);font-size:calc(18px * var(--fz));border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;box-shadow:0 2px 0 var(--line)}
.tile:hover{border-color:var(--navy-2)}
.ref{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--navy-soft);font-size:15px}
.ref .zh{font-size:18px}

/* hanzi */
.hz-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.hz-pick button{width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-zh-d);font-size:28px;font-weight:700;color:var(--navy-2)}
.hz-pick button.on{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
.hz-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.mizi{position:relative;background:var(--card);border:2px solid var(--accent);border-radius:4px}
.mizi svg.bgrid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mizi .w{position:relative}
.hz-info h3{font-family:var(--f-zh-d);font-size:64px;color:var(--navy-2);line-height:1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin-top:14px}
.kv dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.kv dd{margin:0}
.tip{margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:10px;border-left:3px solid var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.steps svg{width:52px;height:52px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.copybook{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.copybook .mizi{border-width:1px}
@media (max-width:700px){.hz-main{grid-template-columns:1fr}.hz-main>div:first-child{justify-self:center}}

/* records / monitor */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stat b{display:block;font-size:26px;color:var(--navy-2);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.rank{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;background:var(--surface);font-size:13px}
.rank.r1{background:var(--accent);color:#fff}.rank.r2{background:var(--navy-2);color:#fff}.rank.r3{background:var(--navy-soft);color:var(--navy-2)}
.mini-bar{display:inline-block;width:70px;height:6px;border-radius:9px;background:var(--surface);overflow:hidden;vertical-align:middle}
.mini-bar i{display:block;height:100%;background:var(--navy-2)}
.me-row td{background:var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--bad-bg);color:var(--bad)}

/* vocab + assignments */
.vgroups{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.vgroups .chip{font-size:13px;padding:5px 11px;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:4px;vertical-align:middle}
.cnum{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:11.5px;margin-left:4px}
.chip.on .cnum{background:rgba(255,255,255,.2);color:#fff}
.agroup{margin-bottom:26px}
.agh{font-size:18px;color:var(--navy-2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acard.is-done{background:var(--surface)}
.acard.is-late{border-color:var(--bad)}
.acard h3{font-size:16.5px}
.acard-h{display:flex;align-items:center;gap:8px}
.acard-f{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.kind{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.k-web{background:var(--navy-soft);color:var(--navy-2)}
.k-extra{background:var(--accent-soft);color:var(--accent)}
.k-wb{background:var(--ok-bg);color:var(--ok)}
.anote{margin:2px 0 0;font-size:14px;white-space:pre-wrap}
.alink{font-size:14px;color:var(--navy-2);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    { id: 1, title: "小夏和小雨聊小雨面试的情况", vi: "Tiểu Hạ và Tiểu Vũ nói chuyện về buổi phỏng vấn", lines: [
      ["小夏", "你上午的面试怎么样？"],
      ["小雨", "还可以，他们问的问题都挺容易的，就是我有点儿紧张。"],
      ["小夏", "面试的时候，一定要对自己有信心，要相信自己的能力。"],
      ["小雨", "你说得对！3月15号上午8点在学校体育馆还有一个招聘会，你去吗？"],
      ["小夏", "我还没决定呢。"],
      ["小雨", "听说这次招聘会提供的工作机会很多，我们一起去看看吧。"]]},
    { id: 2, title: "马经理和小林聊招聘的事情", vi: "Giám đốc Mã và Tiểu Lâm bàn chuyện tuyển dụng", lines: [
      ["马经理", "小林，这次招聘不是小李负责吗？"],
      ["小林", "本来是小李负责的，但是他突然生病住院了，所以就交给我来做了。"],
      ["马经理", "哦，这次应聘的人多吗？"],
      ["小林", "经理，这次来应聘的一共有15人。经过笔试和面试，有两个不错。这是他们的材料，您看看。"],
      ["马经理", "这两个人的能力都比较符合我们的要求。你通知他们下周一上午九点来我办公室吧。"],
      ["小林", "好的，那我马上跟他们联系。"]]},
    { id: 3, title: "小林和王静聊王静的工作情况", vi: "Tiểu Lâm và Vương Tĩnh nói chuyện về công việc của Vương Tĩnh", lines: [
      ["小林", "王静，好久不见了！大学毕业后就没联系了，你现在在哪儿工作呢？"],
      ["王静", "我一毕业就去上海当律师了。"],
      ["小林", "你对现在的工作一定非常满意吧？"],
      ["王静", "我很喜欢现在的工作，因为我学的就是法律专业，而且同事们都很喜欢我。另外，收入也不错。"],
      ["小林", "星期天咱们同学聚会，你能来参加吗？"],
      ["王静", "能来。虽然这次来北京，时间安排得很紧张，但我一定借这次机会去跟大家见见面。"]]},
    { id: 4, title: "面试需要注意什么", vi: "Đoạn văn: những điều cần chú ý khi phỏng vấn", lines: [
      ["", "面试的时候，经理对我印象不错，还通知我明天就可以上班了。真没想到，找工作这么顺利。你想知道面试需要注意什么吗？首先，要穿正式的衣服，这会给面试者留下一个好的印象，让他觉得你是一个认真的人。其次，应聘时不要紧张，回答问题时，说得不要太快，声音也不要太小，要相信自己有能力做好。当然，最重要的是回答问题要诚实。"]]},
    { id: 5, title: "第一印象", vi: "Đoạn văn: ấn tượng đầu tiên", lines: [
      ["", "第一印象就是在第一次见面时给别人留下的印象。虽然第一印象不总是对的，但如果想改变却很困难。你给别人的第一印象会影响他们以后对你的感觉和判断。所以，给第一次见面的同事留下好的印象，以后的工作可能会更顺利；给第一次见面的顾客留下好的印象，你可能会卖出更多的东西。但是，如果第一次见面给别人留下像不准时这样的坏印象，那么以后就很难让别人相信你。所以不管是上课、上班，还是与别人约会，准时都非常重要。"]]}
  ],

let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang)); VOICES.sort((a, b) => (/CN/.test(b.lang) - /CN/.test(a.lang))); } catch (e) {} }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let RATE = ls.get("tpc-rate", 0.85);
function speak(text, opt = {}) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) { toast("Trình duyệt này chưa hỗ trợ đọc tiếng Trung"); return res(); }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = opt.rate || RATE; u.pitch = opt.pitch || 1;
    const v = VOICES[opt.voice || 0] || VOICES[0]; if (v) u.voice = v;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} }
async function speakSeq(lines) { stopSpeak(); for (const [who, t] of lines) { const female = /^(女|王静|售货员|小丽|妈妈|周太太|张太太|秘书|孙月|高老师|小红|李小美)$/.test(who); await speak(t, { pitch: female ? 1.15 : 0.85, voice: female ? 0 : (VOICES.length > 1 ? 1 : 0) }); } }
const py = t => { try { return window.pinyinPro ? pinyinPro.pinyin(t, { toneType: "symbol" }).replace(/ ([，。！？：；、“”])/g, "$1").replace(/([“]) /g, "$1") : ""; } catch (e) { return ""; } };

const P = { db: null, user: null, uid: null, teacher: false, all: [], assigns: [], names: {}, ready: false };
const blankMe = () => ({ nick: "", cls: "", goal: "HSK 4", scores: {}, attempts: [], learned: {}, days: [], lastActive: 0, last: null, done: {} });
let ME = Object.assign(blankMe(), ls.get("tpc-me", {}));
let saveTimer = null, saving = Promise.resolve();
function save() {
  ME.lastActive = Date.now();
  ls.set("tpc-me", ME);
  if (!P.db || !P.uid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const snap = JSON.parse(JSON.stringify(ME));
    saving = saving.then(() => P.db.collection("progress").doc(P.uid).set(snap)).catch(e => { console.warn("save", e); if (e && e.code === "invalid_argument") { P.canWrite = false; setSync(false, "Chỉ lưu trên máy này"); } });
  }, 900);
}
function lessonKey() { return S.course + "-" + S.lesson; }
function record(ex, got, total, key) {
  const k = (key || lessonKey()) + ":" + ex, pct = total ? got / total : 0, now = Date.now();
  const prev = ME.scores[k];
  ME.scores[k] = { best: Math.max(prev ? prev.best : 0, pct), last: pct, got, total, at: now, n: (prev ? prev.n : 0) + 1 };
  ME.attempts.unshift({ k, got, total, at: now }); ME.attempts = ME.attempts.slice(0, 40);
  if (!ME.days.includes(today())) ME.days.push(today());
  ME.days = ME.days.slice(-120);
  save();
}
function touch() { ME.last = { course: S.course, lesson: S.lesson, tab: S.tab }; if (!ME.days.includes(today())) ME.days.push(today()); save(); }
const SYNC = { on: false, text: "Lưu trên máy này" };
function setSync(on, text) { SYNC.on = on; SYNC.text = text; const s = $("#sync"); if (s) { s.classList.toggle("on", on); s.lastElementChild.textContent = text; } }
const EXNAMES = { "v-mc": "Trắc nghiệm nghĩa", "v-match": "Nối từ", "v-fill": "Điền từ", "g-mc": "Chọn đáp án", "g-yt": "Phân biệt từ gần nghĩa", "g-pos": "Chọn vị trí", "read": "Luyện đọc", "listen": "Luyện nghe", "w-order": "Sắp xếp câu", "w-vz": "Dịch Việt → Trung", "w-zv": "Dịch Trung → Việt", "w-make": "Đặt câu", "x-mc": "Trắc nghiệm nghĩa", "x-match": "Nối từ", "x-listen": "Nghe chọn từ", "x-py": "Chọn phiên âm" };
const SKILL = { "Từ vựng": "v-", "Từ vựng HSK": "x-", "Ngữ pháp": "g-", "Đọc": "read", "Nghe": "listen", "Viết": "w-" };
function statsOf(m) {
  const sc = m.scores || {}, keys = Object.keys(sc);
  const avg = keys.length ? keys.reduce((s, k) => s + sc[k].best, 0) / keys.length : 0;
  const skills = {};
  for (const [n, pre] of Object.entries(SKILL)) { const ks = keys.filter(k => k.split(":")[1].startsWith(pre)); skills[n] = ks.length ? ks.reduce((s, k) => s + sc[k].best, 0) / ks.length : null; }
  const learned = Object.values(m.learned || {}).reduce((s, a) => s + (a ? a.length : 0), 0);
  const points = Math.round(keys.reduce((s, k) => s + sc[k].best * 100, 0) + learned * 5 + (m.days || []).length * 20 + Object.keys(m.done || {}).length * 30);
  return { done: keys.length, avg, skills, learned, points, days: (m.days || []).length, attempts: (m.attempts || []).length };
}
function keyLabel(l, short) { const [c, n] = l.split("-"); if (c === "vocab") return "Từ vựng HSK " + n; return courseOf(c).name + (short ? " · B" : " · Bài ") + n; }
function displayName(id, m) { return (m && m.nick) || P.names[id] || (id === P.uid ? "Bạn" : "Học sinh"); }
async function resolveNames(ids) {
  if (!P.user || !ids.length) return;
  try { const ps = await P.user.profiles(ids); let ch = false; for (const id of ids) { const n = ps[id] && ps[id].name; if (n && P.names[id] !== n) { P.names[id] = n; ch = true; } } if (ch && ["monitor", "records", "assign"].includes(S.view)) render(); } catch (e) {}
}
async function initCaps() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    P.user = user;
    if (user) { try { P.teacher = await user.isOwner(); try { P.canWrite = await user.can("data.write"); } catch (e) { P.canWrite = null; } } catch (e) {} }
    if (!db || !user) { setSync(false, "Lưu trên máy này"); if (S.view !== "course") render(); return; }
    P.db = db; P.uid = await user.id();
    if (!P.uid) return;
    const snap = await db.collection("progress").doc(P.uid).get();
    if (snap.exists) { const r = snap.data(); const loc = ME; ME = Object.assign(blankMe(), r); for (const k in loc.scores) if (!ME.scores[k] || loc.scores[k].best > ME.scores[k].best) ME.scores[k] = loc.scores[k]; ls.set("tpc-me", ME); }
    if (Object.keys(ME.scores).length || ME.nick) save();
    setSync(true, "Đã đồng bộ");
    db.collection("progress").onSnapshot(s => { P.all = s.docs.map(d => ({ id: d.id, ...d.data() })); resolveNames(P.all.map(x => x.id)); if (["monitor", "records", "assign", "home"].includes(S.view)) render(); }, e => console.warn(e));
    db.collection("assign").onSnapshot(s => { P.assigns = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); if (["assign", "home"].includes(S.view)) render(); }, e => console.warn(e));
    P.ready = true; if (S.view !== "course") render();
  } catch (e) { console.warn("caps", e); }
}

/* ---------- Flashcard ---------- */
let FC = { order: null, i: 0, key: "" };
function tFlash(p, D, key) {
  const k = key || lessonKey(); if (FC.key !== k || !FC.order) FC = { order: D.vocab.map((_, i) => i), i: 0, key: k };
  const learned = new Set(ME.learned[k] || []);
  const mode = sub("fc", [["one", "Thẻ to"], ["all", "Tất cả thẻ"]], "one");
  const card = (vi, big) => { const v = D.vocab[vi]; return `<button class="fc" data-i="${vi}" aria-label="Lật thẻ ${v[0]}"><div class="fc-in">
    <div class="fc-face front">${big ? `<span class="corner">Chạm để lật</span>` : ""}${learned.has(vi) ? `<span class="learned pill ok">Đã thuộc</span>` : ""}<div class="big">${v[0]}</div></div>
    <div class="fc-face back"><div class="fpy">${v[1]}</div><div class="fvi">${v[2]}</div><div class="fpos">${v[3]}</div></div></div></button>`; };
  if (mode.v === "one") {
    const vi = FC.order[FC.i];
    p.innerHTML = `<div class="row" style="margin-bottom:16px">${mode.html}<span class="spacer"></span><span class="prog">Đã thuộc ${learned.size}/${D.vocab.length}</span></div>
    <div class="fc-stage">${card(vi, true)}
      <div class="prog num">${FC.i + 1} / ${D.vocab.length}</div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="f-prev">◀ Trước</button><button class="btn navy" id="f-flip">Lật thẻ</button><button class="btn" id="f-next">Sau ▶</button>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="f-say">${IC.sound} Nghe</button><button class="btn" id="f-shuf">Xáo trộn</button>
        <button class="btn ${learned.has(vi) ? "" : "pri"}" id="f-learn">${learned.has(vi) ? "Bỏ đánh dấu" : "Đánh dấu đã thuộc"}</button>
      </div><p class="muted" style="font-size:13px">Phím tắt: ← → chuyển thẻ, phím cách để lật</p></div>`;
    const fc = $(".fc", p), flip = () => fc.classList.toggle("flip");
    fc.onclick = flip; $("#f-flip").onclick = flip;
    const mv = d => { FC.i = (FC.i + d + D.vocab.length) % D.vocab.length; tFlash(p, D, key); };
    $("#f-prev").onclick = () => mv(-1); $("#f-next").onclick = () => mv(1);
    $("#f-say").onclick = () => speak(D.vocab[vi][0]);
    $("#f-shuf").onclick = () => { FC.order = shuffle(FC.order); FC.i = 0; tFlash(p, D, key); toast("Đã xáo trộn thẻ"); };
    $("#f-learn").onclick = () => { const a = new Set(ME.learned[k] || []); a.has(vi) ? a.delete(vi) : a.add(vi); ME.learned[k] = [...a]; save(); tFlash(p, D, key); };
    document.onkeydown = e => { if ((S.view === "course" ? S.tab !== "flash" : S.vtab !== "flash") || (S.sub.fc || "one") !== "one" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === "ArrowRight") mv(1); else if (e.key === "ArrowLeft") mv(-1); else if (e.key === " ") { e.preventDefault(); flip(); } };
  } else {
    p.innerHTML = `<div class="row" style="margin-bottom:16px">${mode.html}<span class="spacer"></span><button class="btn" id="f-shuf">Xáo trộn</button><button class="btn navy" id="f-all">Lật tất cả</button><button class="btn" id="f-none">Úp tất cả</button></div>
      <div class="fc-grid">${FC.order.map(i => card(i, false)).join("")}</div>`;
    $$(".fc", p).forEach(f => f.onclick = () => f.classList.toggle("flip"));
    $("#f-all").onclick = () => $$(".fc", p).forEach(f => f.classList.add("flip"));
    $("#f-none").onclick = () => $$(".fc", p).forEach(f => f.classList.remove("flip"));
    $("#f-shuf").onclick = () => { FC.order = shuffle(FC.order); tFlash(p, D, key); };
  }
  bindSub(p);
}

/* ---------- Câu hỏi trắc nghiệm dùng chung ---------- */
function mcqList(root, items, ex, opt = {}) {
  if (!opt.keepOrder && !items._mixed) { items = items.map(it => { const idx = shuffle(it.o.map((_, i) => i)); return Object.assign({}, it, { o: idx.map(i => it.o[i]), a: idx.indexOf(it.a) }); }); items._mixed = true; }
  // items: {q (html), o:[...], a, zh:bool, after?:html}
  let answered = 0, right = 0;
  root.innerHTML = `<div class="qlist">${items.map((it, n) => `<div class="q" data-n="${n}"><div class="qt"><span class="qn">${n + 1}</span><div style="min-width:0">${it.q}</div></div>
    <div class="opts">${it.o.map((o, j) => `<button class="opt ${it.zh ? "zh" : ""}" data-j="${j}">${String.fromCharCode(65 + j)}. ${esc(o)}</button>`).join("")}</div>${it.after || ""}</div>`).join("")}</div>
    <div class="score" hidden><span>Kết quả</span><b class="num"></b><span class="muted"></span><span class="spacer"></span><button class="btn pri">Làm lại</button></div>`;
  $$(".q", root).forEach(q => { const it = items[+q.dataset.n]; $$(".opt", q).forEach(b => b.onclick = () => {
    const j = +b.dataset.j; $$(".opt", q).forEach(x => x.disabled = true);
    $$(".opt", q)[it.a].classList.add("ok"); if (j !== it.a) b.classList.add("bad"); else right++;
    answered++; if (opt.onAnswer) opt.onAnswer(q, it, j === it.a);
    if (answered === items.length) { const sc = $(".score", root); sc.hidden = false; $("b", sc).textContent = right + " / " + items.length; $(".muted", sc).textContent = right === items.length ? "Xuất sắc!" : right >= items.length * .7 ? "Tốt lắm, xem lại câu sai nhé." : "Ôn lại phần này rồi làm lại nhé."; record(ex, right, items.length, opt.key); }
  }); });
  $(".score .btn", root).onclick = () => opt.redo ? opt.redo() : mcqList(root, items, ex, opt);
}

/* ---------- Ôn từ vựng ---------- */
function tVexer(p, D) {
  const m = sub("vx", [["mc", "Dạng 1 · Trắc nghiệm nghĩa"], ["match", "Dạng 2 · Nối từ"], ["fill", "Dạng 3 · Điền từ"]], "mc");
  p.innerHTML = `<div style="margin-bottom:16px">${m.html}</div><div id="vx"></div>`; bindSub(p);
  const box = $("#vx", p);
  if (m.v === "mc") {
    const mk = () => shuffle(D.vocab.map((_, i) => i)).slice(0, 10).map((i, n) => {
      const v = D.vocab[i], rev = n % 3 === 2;
      const others = shuffle(D.vocab.filter((_, j) => j !== i)).slice(0, 3);
      const opts = shuffle([v, ...others]);
      return rev ? { q: `Từ nào có nghĩa “<b>${esc(v[2])}</b>”?`, o: opts.map(x => x[0]), a: opts.indexOf(v), zh: true }
        : { q: `<span class="zhq" style="font-family:var(--f-zh-d);font-size:30px;font-weight:700;color:var(--navy-2)">${v[0]}</span> <span class="muted">nghĩa là gì?</span>`, o: opts.map(x => x[2]), a: opts.indexOf(v) };
    });
    const run = () => mcqList(box, mk(), "v-mc", { redo: run }); run();
  } else if (m.v === "match") {
    let misses = 0, done = 0, sel = null;
    const pick = shuffle(D.vocab.map((_, i) => i)).slice(0, 6);
    const right = shuffle(pick);
    box.innerHTML = `<p class="muted" style="margin-top:0">Chọn một chữ Hán bên trái rồi chọn nghĩa đúng bên phải.</p>
      <div class="match"><div class="col">${pick.map(i => `<button class="zh" data-i="${i}">${D.vocab[i][0]}</button>`).join("")}</div>
      <div class="col">${right.map(i => `<button data-m="${i}">${esc(D.vocab[i][2])}</button>`).join("")}</div></div>
      <div class="score" hidden><span>Hoàn thành</span><b class="num"></b><span class="muted"></span><span class="spacer"></span><button class="btn pri">Lượt mới</button></div>`;
    $$("[data-i]", box).forEach(b => b.onclick = () => { if (b.classList.contains("done")) return; $$("[data-i]", box).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; speak(D.vocab[b.dataset.i][0]); });
    $$("[data-m]", box).forEach(b => b.onclick = () => {
      if (!sel || b.classList.contains("done")) return;
      if (b.dataset.m === sel.dataset.i) { b.classList.add("done"); sel.classList.add("done"); sel.classList.remove("sel"); sel = null; done++;
        if (done === 6) { const sc = $(".score", box); sc.hidden = false; const got = Math.max(0, 6 - misses); $("b", sc).textContent = got + " / 6"; $(".muted", sc).textContent = misses ? `Nối sai ${misses} lần` : "Không sai lần nào!"; record("v-match", got, 6); } }
      else { misses++; b.classList.remove("miss"); void b.offsetWidth; b.classList.add("miss"); }
    });
    $(".score .btn", box).onclick = () => tVexer(p, D);
  } else {
    box.innerHTML = D.fill.map((g, gi) => `<div style="margin-bottom:22px"><div class="bank">${g.bank.map(w => `<span>${w}</span>`).join("")}</div>
      <div class="qlist">${g.items.map((it, n) => `<div class="q"><div class="qt"><span class="qn">${gi * 5 + n + 1}</span><span class="zhq">${esc(it[0]).replace("___", `<select class="blank-sel" data-a="${it[1]}"><option value="">——</option>${g.bank.map(w => `<option>${w}</option>`).join("")}</select>`)}</span></div></div>`).join("")}</div></div>`).join("") +
      `<div class="row"><button class="btn pri" id="fill-ck">Kiểm tra</button><button class="btn" id="fill-re">Làm lại</button></div><div class="score" hidden><span>Kết quả</span><b class="num"></b></div>`;
    $("#fill-ck").onclick = () => { let r = 0; const ss = $$(".blank-sel", box); ss.forEach(s => { const ok = s.value === s.dataset.a; r += ok; s.classList.toggle("ok-box", ok); s.classList.toggle("bad-box", !ok); s.title = ok ? "" : "Đáp án: " + s.dataset.a; const q = s.closest(".q"); let f = $(".fb", q); if (!ok) { if (!f) { f = document.createElement("div"); f.className = "fb bad-box"; q.appendChild(f); } f.textContent = "Đáp án đúng: " + s.dataset.a; } else if (f) f.remove(); }); const sc = $(".score", box); sc.hidden = false; $("b", sc).textContent = r + " / " + ss.length; record("v-fill", r, ss.length); };
    $("#fill-re").onclick = () => tVexer(p, D);
  }
}

/* ---------- Ngữ pháp ---------- */
function tGram(p, D) {
  p.innerHTML = `<h2 class="ph">Ngữ pháp trọng tâm</h2>` + D.grammar.map((g, i) => `<article class="gcard">
    <div class="gcard-h"><span class="gn">${i + 1}</span><h3>${g.h}</h3><span class="gpy">${g.py}</span><span class="spacer"></span><span class="badge navy">${g.tag}</span></div>
    ${g.parts.map(pt => `<div class="gpart"><div class="formula">${esc(pt.f)}</div><div><div>${pt.m}</div>
      <ul class="gex">${pt.ex.map(e => `<li><button class="icon-btn" data-say="${esc(e[0])}" aria-label="Nghe">${IC.sound}</button><div><div class="zh">${esc(e[0])}</div><div class="vi">${esc(e[1])}</div></div></li>`).join("")}</ul></div></div>`).join("")}
    ${g.note ? `<p class="gnote"><b>Lưu ý:</b> ${esc(g.note)}</p>` : ""}</article>`).join("") +
    `<article class="gcard"><div class="gcard-h"><span class="gn">≈</span><h3 style="font-size:22px">${D.compare.title}</h3></div>
     <div style="padding:16px 18px"><p style="margin-top:0"><b style="color:var(--ok)">Giống nhau:</b> ${esc(D.compare.same)}</p>
     <div class="tbl-wrap"><table><thead><tr><th>Điểm khác</th><th>${D.compare.a}</th><th>${D.compare.b}</th></tr></thead><tbody>${D.compare.diff.map(r => `<tr><td><b>${r[0]}</b></td><td class="zh">${esc(r[1])}</td><td class="zh">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div></article>`;
  $$("[data-say]", p).forEach(b => b.onclick = () => { stopSpeak(); speak(b.dataset.say); });
}

/* ---------- Ôn ngữ pháp ---------- */
function tGexer(p, D) {
  const m = sub("gx", [["mc", "Dạng 1 · Chọn đáp án đúng"], ["yt", `Dạng 2 · ${D.compare.a} hay ${D.compare.b}`], ["pos", "Dạng 3 · Chọn vị trí đúng"]], "mc");
  p.innerHTML = `<div style="margin-bottom:16px">${m.html}</div><div id="gx"></div>`; bindSub(p);
  const box = $("#gx", p);
  if (m.v === "mc") {
    const run = () => mcqList(box, shuffle(D.gmc).map(x => ({ q: `<span class="zhq">${esc(x[0]).replace("___", "<u>&emsp;&emsp;</u>")}</span>`, o: x[1], a: x[2], zh: true })), "g-mc", { redo: run }); run();
  } else if (m.v === "yt") {
    const O = [D.compare.a, D.compare.b, "Cả hai đều được"];
    box.innerHTML = `<p class="muted" style="margin-top:0">Chọn từ phù hợp điền vào chỗ trống. Nếu cả ${D.compare.a} và ${D.compare.b} đều dùng được, chọn “Cả hai đều được”.</p><div id="yt"></div>`;
    const run = () => mcqList($("#yt", box), D.gyt.map(x => ({ q: `<span class="zhq">${esc(x[0]).replace("___", "<u>&emsp;&emsp;</u>")}</span>`, o: O, a: x[1] === "both" ? 2 : O.indexOf(x[1]), zh: true })), "g-yt", { redo: run, keepOrder: true }); run();
  } else {
    let n = 0, r = 0;
    box.innerHTML = `<p class="muted" style="margin-top:0">Chọn vị trí đúng (A, B, C hoặc D) cho từ trong ô đỏ — dạng bài đọc HSK 4.</p><div class="qlist">${D.gpos.map((x, i) => `<div class="q" data-i="${i}"><div class="qt"><span class="qn">${i + 1}</span><div><span class="wordtag">${x[0]}</span><div class="pos-s">${x[1].map((t, j) => esc(t) + (j < 4 ? `<button class="slot" data-j="${j}">${"ABCD"[j]}</button>` : "")).join("")}</div></div></div></div>`).join("")}</div>
      <div class="score" hidden><span>Kết quả</span><b class="num"></b><span class="spacer"></span><button class="btn pri">Làm lại</button></div>`;
    $$(".q", box).forEach(q => { const x = D.gpos[q.dataset.i]; $$(".slot", q).forEach(b => b.onclick = () => {
      $$(".slot", q).forEach(s => s.disabled = true); const j = +b.dataset.j; $$(".slot", q)[x[2]].classList.add("ok"); if (j !== x[2]) b.classList.add("bad"); else r++;
      const full = x[1].map((t, k) => t + (k === x[2] ? (x[0] === "来说" ? "来说" : x[0]) : "")).join("");
      const f = document.createElement("div"); f.className = "fb " + (j === x[2] ? "ok-box" : "bad-box"); f.innerHTML = `<span class="zh">${esc(full)}</span>`; q.appendChild(f);
      if (++n === D.gpos.length) { const sc = $(".score", box); sc.hidden = false; $("b", sc).textContent = r + " / " + n; record("g-pos", r, n); }
    }); });
    $(".score .btn", box).onclick = () => tGexer(p, D);
  }
}

/* ---------- Luyện đọc ---------- */
function textHTML(t, showPy) {
  const body = t.lines[0][0] ? `<div class="dl">${t.lines.map(l => `<span class="who">${l[0]}：</span><span class="say">${esc(l[1])}<span class="pyl">${esc(py(l[1]))}</span></span>`).join("")}</div>`
    : `<p class="para">${esc(t.lines[0][1])}<span class="pyl" style="margin-top:6px">${esc(py(t.lines[0][1]))}</span></p>`;
  return `<div class="textbox ${showPy ? "" : "hide-py"}"><div class="row"><span class="badge">课文 ${t.id}</span><h3>${t.title}</h3></div><div class="muted" style="margin-top:4px">${t.vi}</div>${body}</div>`;
}
function tRead(p, D) {
  const ti = +(S.sub.rt || 1), t = D.texts[ti - 1], showPy = !!S.sub.rpy;
  p.innerHTML = `<div class="row" style="margin-bottom:14px"><div class="seg" id="rt">${D.texts.map(x => `<button class="${x.id === ti ? "on" : ""}" data-k="${x.id}">Bài khoá ${x.id}</button>`).join("")}</div><span class="spacer"></span>
    <button class="btn" id="r-py">${showPy ? "Ẩn phiên âm" : "Hiện phiên âm"}</button><button class="btn" id="r-say">${IC.sound} Nghe bài khoá</button><button class="btn ghost" id="r-stop">Dừng</button></div>
    ${textHTML(t, showPy)}<h2 class="ph">Câu hỏi đọc hiểu</h2><div id="rq"></div>`;
  $$("#rt button", p).forEach(b => b.onclick = () => { S.sub.rt = +b.dataset.k; go({}); });
  $("#r-py").onclick = () => { S.sub.rpy = !showPy; go({}); };
  $("#r-say").onclick = () => speakSeq(t.lines.map(l => [l[0], l[1]]));
  $("#r-stop").onclick = stopSpeak;
  const qs = D.read.filter(q => q[0] === ti);
  const run = () => mcqList($("#rq", p), qs.map(q => ({ q: `<span class="zhq">${esc(q[1])}</span>`, o: q[2], a: q[3], zh: true })), "read", { redo: run }); run();
}

/* ---------- Luyện nghe ---------- */
function tListen(p, D) {
  const m = sub("ls", [["q", "Nghe và chọn đáp án"], ["t", "Nghe bài khoá"]], "q");
  p.innerHTML = `<div class="row" style="margin-bottom:16px">${m.html}<span class="spacer"></span><label class="muted" style="font-size:13px">Tốc độ</label><select id="l-rate" style="width:auto">${[[.6, "Chậm"], [.85, "Vừa"], [1, "Thường"]].map(([r, n]) => `<option value="${r}" ${RATE == r ? "selected" : ""}>${n}</option>`).join("")}</select></div><div id="lx"></div>`;
  bindSub(p); $("#l-rate").onchange = e => { RATE = +e.target.value; ls.set("tpc-rate", RATE); };
  const box = $("#lx", p);
  if (!VOICES.length && "speechSynthesis" in window) box.insertAdjacentHTML("beforebegin", `<p class="fb bad-box" style="margin-top:0">Máy chưa có giọng đọc tiếng Trung, âm thanh có thể không đúng. Hãy cài giọng Chinese (Mandarin) trong cài đặt ngôn ngữ của thiết bị hoặc dùng Chrome/Safari.</p>`);
  if (m.v === "q") {
    const items = D.listen.map(x => ({ q: `<div class="row lcard" style="gap:12px"><button class="play" data-play aria-label="Phát">${IC.play}</button><span class="muted">Nghe đoạn hội thoại rồi trả lời câu hỏi (câu hỏi được đọc ở cuối)</span></div>`, o: x.o, a: x.a, zh: true, after: `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:13px">Xem lời thoại</summary><div class="trans">${x.s.map(l => `<div><b>${l[0]}：</b>${esc(l[1])}</div>`).join("")}<div><b>问：</b>${esc(x.q)}</div></div></details>`, x }));
    const run = () => { mcqList(box, items, "listen", { redo: run }); $$(".q", box).forEach(q => { const x = items[+q.dataset.n].x, b = $("[data-play]", q); b.onclick = async () => { $$(".play.on").forEach(e => e.classList.remove("on")); b.classList.add("on"); await speakSeq([...x.s, ["男", "问：" + x.q]]); b.classList.remove("on"); }; }); };
    run();
  } else {
    box.innerHTML = D.texts.map(t => `<div class="q lcard" style="margin-bottom:12px"><div class="row"><button class="play" data-t="${t.id}" aria-label="Phát bài khoá ${t.id}">${IC.play}</button><div><b class="zh" style="font-size:18px">课文 ${t.id} · ${t.title}</b><div class="muted" style="font-size:13px">${t.vi}</div></div><span class="spacer"></span><button class="btn sm" data-show="${t.id}">Hiện lời</button></div><div class="tx" hidden></div></div>`).join("");
    $$("[data-t]", box).forEach(b => b.onclick = async () => { const t = D.texts[b.dataset.t - 1]; $$(".play.on").forEach(e => e.classList.remove("on")); b.classList.add("on"); await speakSeq(t.lines); b.classList.remove("on"); });
    $$("[data-show]", box).forEach(b => b.onclick = () => { const tx = $(".tx", b.closest(".q")); tx.hidden = !tx.hidden; if (!tx.innerHTML) tx.innerHTML = textHTML(D.texts[b.dataset.show - 1], false); b.textContent = tx.hidden ? "Hiện lời" : "Ẩn lời"; });
  }
}

/* ---------- Luyện viết ---------- */
function selfGrade(q, onDone) {
  const r = document.createElement("div"); r.className = "row"; r.style.marginTop = "8px";
  r.innerHTML = `<span class="muted" style="font-size:13px">Tự đánh giá:</span><button class="btn sm" data-g="1">Đúng ý</button><button class="btn sm" data-g="0">Chưa đúng</button>`;
  q.appendChild(r); $$("button", r).forEach(b => b.onclick = () => { r.innerHTML = b.dataset.g === "1" ? `<span class="pill ok">Đúng</span>` : `<span class="pill late">Cần ôn lại</span>`; onDone(b.dataset.g === "1"); });
}
function tWrite(p, D) {
  const m = sub("wx", [["order", "Dạng 1 · Sắp xếp câu"], ["vz", "Dạng 2 · Dịch Việt → Trung"], ["zv", "Dạng 3 · Dịch Trung → Việt"], ["make", "Dạng 4 · Dùng từ đặt câu"]], "order");
  p.innerHTML = `<div style="margin-bottom:16px">${m.html}</div><div id="wx"></div>`; bindSub(p);
  const box = $("#wx", p); let n = 0, r = 0;
  const fin = (ex, total) => { if (n === total) { const sc = $(".score", box); sc.hidden = false; $("b", sc).textContent = r + " / " + total; record(ex, r, total); } };
  const scoreBar = `<div class="score" hidden><span>Kết quả</span><b class="num"></b><span class="spacer"></span><button class="btn pri" id="w-re">Làm lại</button></div>`;
  if (m.v === "order") {
    box.innerHTML = `<p class="muted" style="margin-top:0">Bấm lần lượt các từ để ghép thành câu đúng. Bấm vào từ trong khung để trả lại.</p><div class="qlist">${D.order.map((x, i) => `<div class="q" data-i="${i}"><div class="qt"><span class="qn">${i + 1}</span><span class="muted">${esc(x[2])}</span></div><div class="tiles ans"></div><div class="tiles pool">${shuffle(x[0]).map(t => `<button class="tile">${esc(t)}</button>`).join("")}</div><div class="row"><button class="btn sm pri" data-ck>Kiểm tra</button></div></div>`).join("")}</div>${scoreBar}`;
    $$(".q", box).forEach(q => { const x = D.order[q.dataset.i], ans = $(".ans", q), pool = $(".pool", q);
      q.addEventListener("click", e => { const t = e.target.closest(".tile"); if (!t || q.dataset.done) return; (t.parentElement === pool ? ans : pool).appendChild(t); });
      $("[data-ck]", q).onclick = () => { if (q.dataset.done) return; if ($$(".tile", pool).length) return toast("Hãy dùng hết các từ"); q.dataset.done = 1; const ok = norm($$(".tile", ans).map(t => t.textContent).join("")) === norm(x[1]); n++; r += ok; ans.classList.add(ok ? "ok-box" : "bad-box"); q.insertAdjacentHTML("beforeend", `<div class="ref"><span class="zh">${esc(x[1])}</span></div>`); fin("w-order", D.order.length); };
    });
  } else if (m.v === "vz") {
    box.innerHTML = `<p class="muted" style="margin-top:0">Dịch sang tiếng Trung (gõ chữ Hán). Nếu cách viết khác đáp án, xem câu mẫu và tự đánh giá.</p><div class="qlist">${D.vz.map((x, i) => `<div class="q" data-i="${i}"><div class="qt"><span class="qn">${i + 1}</span><span>${esc(x[0])}</span></div><div class="row"><input id="vz${i}" lang="zh" class="zh" style="flex:1;min-width:200px;font-size:18px" placeholder="Nhập câu tiếng Trung…"><button class="btn sm pri" data-ck>Kiểm tra</button></div></div>`).join("")}</div>${scoreBar}`;
    $$(".q", box).forEach(q => { const x = D.vz[q.dataset.i]; $("[data-ck]", q).onclick = () => { if (q.dataset.done) return; const v = norm($("input", q).value); if (!v) return toast("Hãy nhập câu trả lời"); q.dataset.done = 1;
      const ok = x[1].some(a => norm(a) === v); q.insertAdjacentHTML("beforeend", `<div class="ref">Câu mẫu: <span class="zh">${esc(x[1][0])}</span></div>`);
      if (ok) { $("input", q).classList.add("ok-box"); n++; r++; fin("w-vz", D.vz.length); } else selfGrade(q, g => { n++; r += g; fin("w-vz", D.vz.length); }); }; });
  } else if (m.v === "zv") {
    box.innerHTML = `<p class="muted" style="margin-top:0">Dịch sang tiếng Việt, sau đó xem bản dịch tham khảo và tự đánh giá.</p><div class="qlist">${D.zv.map((x, i) => `<div class="q" data-i="${i}"><div class="qt"><span class="qn">${i + 1}</span><span class="zhq">${esc(x[0])}</span><button class="icon-btn" data-say aria-label="Nghe">${IC.sound}</button></div><textarea id="zv${i}" rows="2" placeholder="Bản dịch của bạn…"></textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" data-ck>Xem bản dịch tham khảo</button></div></div>`).join("")}</div>${scoreBar}`;
    $$(".q", box).forEach(q => { const x = D.zv[q.dataset.i]; $("[data-say]", q).onclick = () => speak(x[0]); $("[data-ck]", q).onclick = () => { if (q.dataset.done) return; q.dataset.done = 1; q.insertAdjacentHTML("beforeend", `<div class="ref">${esc(x[1])}</div>`); selfGrade(q, g => { n++; r += g; fin("w-zv", D.zv.length); }); }; });
  } else {
    box.innerHTML = `<p class="muted" style="margin-top:0">Dùng từ cho sẵn viết một câu hoàn chỉnh (dạng Viết phần 2 của HSK 4).</p><div class="qlist">${D.make.map((x, i) => `<div class="q" data-i="${i}"><div class="qt"><span class="qn">${i + 1}</span><span><span class="wordtag">${x[0]}</span><span class="muted">Gợi ý tình huống: ${esc(x[1])}</span></span></div><input id="mk${i}" lang="zh" class="zh" style="font-size:18px" placeholder="Viết câu có từ ${x[0]}…"><div class="row" style="margin-top:8px"><button class="btn sm pri" data-ck>Kiểm tra</button></div></div>`).join("")}</div>${scoreBar}`;
    $$(".q", box).forEach(q => { const x = D.make[q.dataset.i]; $("[data-ck]", q).onclick = () => { if (q.dataset.done) return; const v = $("input", q).value.trim();
      if (!v.includes(x[0])) return toast("Câu cần có từ " + x[0]); if (norm(v).length < 5) return toast("Câu hơi ngắn, viết đầy đủ hơn nhé");
      q.dataset.done = 1; q.insertAdjacentHTML("beforeend", `<div class="ref">Câu mẫu: <span class="zh">${esc(x[2])}</span></div>`); selfGrade(q, g => { n++; r += g; fin("w-make", D.make.length); }); }; });
  }
  const re = $("#w-re", box); if (re) re.onclick = () => tWrite(p, D);
}

  const m = sub("vx2", [["mc", "Dạng 1 · Trắc nghiệm nghĩa"], ["match", "Dạng 2 · Nối từ"], ["listen", "Dạng 3 · Nghe chọn từ"]], "mc");
  box.innerHTML = `<div style="margin-bottom:16px">${m.html}</div><div id="vx2"></div>`; bindSub(box);
  const area = $("#vx2", box), pool = all.length > 8 ? all : rows;
  const distract = (r, f) => { const out = []; const seen = new Set([f(r)]); for (const x of shuffle(pool)) { if (out.length === 3) break; if (!seen.has(f(x))) { seen.add(f(x)); out.push(x); } } return shuffle([r, ...out]); };
  if (m.v === "mc") {
    const mk = () => shuffle(rows).slice(0, 10).map((r, i) => { const rev = i % 3 === 2, o = distract(r, x => rev ? x[0] : x[2]);
      return rev ? { q: `Từ nào có nghĩa “<b>${esc(r[2])}</b>”?`, o: o.map(x => x[0]), a: o.indexOf(r), zh: true }
        : { q: `<span style="font-family:var(--f-zh-d);font-size:30px;font-weight:700;color:var(--navy-2)">${r[0]}</span> <span class="muted">nghĩa là gì?</span>`, o: o.map(x => x[2]), a: o.indexOf(r) }; });
    const run = () => mcqList(area, mk(), "x-mc", { redo: run, key }); run();
  } else if (m.v === "match") {
    let misses = 0, done = 0, sel = null; const pick = shuffle(rows).slice(0, 6), right = shuffle(pick);
    area.innerHTML = `<p class="muted" style="margin-top:0">Chọn một chữ Hán bên trái rồi chọn nghĩa đúng bên phải.</p><div class="match"><div class="col">${pick.map((r, i) => `<button class="zh" data-i="${i}">${r[0]}</button>`).join("")}</div><div class="col">${right.map(r => `<button data-m="${pick.indexOf(r)}">${esc(r[2])}</button>`).join("")}</div></div>
      <div class="score" hidden><span>Hoàn thành</span><b class="num"></b><span class="muted"></span><span class="spacer"></span><button class="btn pri">Lượt mới</button></div>`;
    $$("[data-i]", area).forEach(b => b.onclick = () => { if (b.classList.contains("done")) return; $$("[data-i]", area).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; speak(pick[b.dataset.i][0]); });
    $$("[data-m]", area).forEach(b => b.onclick = () => { if (!sel || b.classList.contains("done")) return;
      if (b.dataset.m === sel.dataset.i) { b.classList.add("done"); sel.classList.add("done"); sel.classList.remove("sel"); sel = null;
        if (++done === pick.length) { const sc = $(".score", area); sc.hidden = false; const got = Math.max(0, pick.length - misses); $("b", sc).textContent = got + " / " + pick.length; $(".muted", sc).textContent = misses ? `Nối sai ${misses} lần` : "Không sai lần nào!"; record("x-match", got, pick.length, key); } }
      else { misses++; b.classList.remove("miss"); void b.offsetWidth; b.classList.add("miss"); } });
    $(".score .btn", area).onclick = () => vExer(box, rows, all, key);
  } else {
    const items = shuffle(rows).slice(0, 10).map(r => { const o = distract(r, x => x[0]); return { q: `<div class="row lcard" style="gap:12px"><button class="play" data-play aria-label="Phát">${IC.play}</button><span class="muted">Nghe rồi chọn chữ Hán đúng</span></div>`, o: o.map(x => x[0]), a: o.indexOf(r), zh: true, r }; });
    const run = () => { mcqList(area, items, "x-listen", { redo: () => vExer(box, rows, all, key), key, onAnswer: (q, it) => q.insertAdjacentHTML("beforeend", `<div class="fb ok-box">${it.r[0]} · ${it.r[1]} · ${esc(it.r[2])}</div>`) });
      $$(".q", area).forEach(q => { const it = items[+q.dataset.n], b = $("[data-play]", q); b.onclick = async () => { b.classList.add("on"); stopSpeak(); await speak(it.r[0]); b.classList.remove("on"); }; }); };
    run();
  }
}

      <div class="card" style="padding:18px"><h3 style="font-size:17px;margin-bottom:12px">Thông tin học viên</h3>
        <form id="acc" class="form-grid">
          <label>Tên hiển thị<input id="ac-nick" value="${esc(ME.nick)}" placeholder="VD: Minh Anh"></label>
          <label>Lớp<input id="ac-cls" value="${esc(ME.cls)}" placeholder="VD: HSK4-K12"></label>
          <label>Mục tiêu<select id="ac-goal">${["HSK 2", "HSK 3", "HSK 4", "HSK 5", "HSK 6"].map(g => `<option ${g === ME.goal ? "selected" : ""}>${g}</option>`).join("")}</select></label>
          <div style="align-self:end"><button class="btn pri" type="submit">Lưu thông tin</button></div>
        </form>
        <p class="muted" style="font-size:13px;margin-bottom:0">${P.db && P.uid && P.canWrite !== false ? "Tiến độ được lưu vào tài khoản và cô giáo theo dõi được." : "Tài khoản này chỉ có quyền xem nên kết quả chỉ lưu trên máy này. Em bấm “Sao chép kết quả gửi cô” rồi dán vào Zalo/Messenger để gửi cô nhé."}</p>
        <div class="row" style="margin-top:12px"><button class="btn navy" id="ac-copy" type="button">Sao chép kết quả gửi cô</button></div>
        <textarea id="ac-out" rows="6" readonly hidden style="margin-top:10px;font-size:13px"></textarea>
      </div>
      <div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b>${st.points}</b><span>Điểm tích luỹ</span></div><div class="stat"><b>${st.done}</b><span>Bài tập đã làm</span></div><div class="stat"><b>${st.learned}</b><span>Từ đã thuộc</span></div><div class="stat"><b>${st.days}</b><span>Ngày có học</span></div></div></div>
    </div>
    ${P.teacher ? `<div class="card guide" style="padding:18px 20px;margin-top:22px"><div class="eyebrow">Chỉ cô nhìn thấy</div><h3 style="font-size:18px;margin:4px 0 10px">Cách cho học sinh vào học</h3>
      <ol style="margin:0;padding-left:20px;display:grid;gap:6px">
        <li>Mỗi học sinh tạo một tài khoản Claude miễn phí tại claude.ai bằng email của em (đây chính là tài khoản đăng nhập vào web).</li>
        <li>Cô mở trang này trên claude.ai, bấm nút <b>Chia sẻ (Share)</b> ở góc trên, nhập email từng học sinh để mời.</li>
        <li>Muốn cô theo dõi được điểm của em ở mục Giám sát: mời em với quyền <b>Người chỉnh sửa (Editor)</b> và <b>không bật</b> chia sẻ bằng đường link. Học sinh vẫn không thấy các nút giao bài, xoá bài hay giám sát.</li>
        <li>Nếu chỉ mời quyền xem hoặc gửi đường link công khai: em vẫn học được đầy đủ, nhưng kết quả chỉ lưu trên máy em; em dùng nút “Sao chép kết quả gửi cô” để gửi điểm.</li>
        <li>Mỗi em vào mục <b>Tài khoản học sinh</b>, điền tên hiển thị và lớp để cô dễ nhận ra trong bảng Giám sát.</li>
      </ol></div>` : ""}
    <h3 style="font-size:18px;margin:26px 0 10px">Lịch sử làm bài gần đây</h3>
    ${ME.attempts.length ? `<div class="tbl-wrap"><table><thead><tr><th>Thời gian</th><th>Bài</th><th>Dạng bài</th><th>Kết quả</th></tr></thead><tbody>${ME.attempts.map(a => { const [l, ex] = a.k.split(":"); return `<tr><td class="num muted">${new Date(a.at).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" })}</td><td>${esc(keyLabel(l))}</td><td>${esc(EXNAMES[ex] || ex)}</td><td class="num"><b>${a.got}/${a.total}</b></td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty"><h3>Chưa có lượt làm bài</h3>Kết quả các bài ôn tập sẽ được ghi lại ở đây.</div>`}
  </section>`;
  $("#ac-copy").onclick = async () => {
    const lines = ["Thượng Phương Các – kết quả ôn tập", "Học sinh: " + (ME.nick || "(chưa đặt tên)") + (ME.cls ? " · Lớp " + ME.cls : ""), "Ngày gửi: " + new Date().toLocaleDateString("vi-VN"), "Điểm tích luỹ: " + st.points + " · Bài tập đã làm: " + st.done + " · Từ đã thuộc: " + st.learned, ""];
    Object.entries(ME.scores).sort((x, y) => y[1].at - x[1].at).forEach(([k, v]) => { const [l, ex] = k.split(":"); lines.push("- " + keyLabel(l) + " · " + (EXNAMES[ex] || ex) + ": cao nhất " + Math.round(v.best * 100) + "% (lần gần nhất " + v.got + "/" + v.total + ")"); });
    const txt = lines.join("\n"), out = $("#ac-out"); out.value = txt; out.hidden = false;
    try { await navigator.clipboard.writeText(txt); toast("Đã sao chép, dán vào tin nhắn gửi cô nhé"); } catch (e) { out.focus(); out.select(); toast("Hãy bôi đen đoạn bên dưới và sao chép"); }
  };
  $("#acc").onsubmit = e => { e.preventDefault(); ME.nick = $("#ac-nick").value.trim().slice(0, 40); ME.cls = $("#ac-cls").value.trim().slice(0, 30); ME.goal = $("#ac-goal").value; save(); toast("Đã lưu thông tin"); render(); };
}

/* ================= Khởi động ================= */
render();
initCaps();

</script>

</body></html>
